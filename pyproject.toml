[project]
name = "gnn-landscape-generation"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "ipykernel>=6.29.5",
    "matplotlib>=3.9.4",
    "optuna>=4.4.0",
    "pandas>=2.3.0",
    "polars>=1.31.0",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.6.1",
    "seaborn>=0.13.2",
    "torch==2.4.0",
    "torchvision>=0.19.0",
    "torch-geometric>=2.6.1",
    "torchmetrics>=1.7.3",
    "h5py>=3.11.0",
    "ogb>=1.3.0",
    "pyg-lib==0.4.0",
    "torch-cluster==1.6.3",
    "torch-scatter==2.1.2",
    "torch-sparse==0.6.18",
    "torch-spline-conv==1.2.2",
    "plotly>=6.4.0",
    "nbformat>=5.10.4",
]


[tool.uv.sources]
pyg-lib = { url = "https://data.pyg.org/whl/torch-2.4.0%2Bcu124/pyg_lib-0.4.0%2Bpt24cu124-cp312-cp312-linux_x86_64.whl" }
